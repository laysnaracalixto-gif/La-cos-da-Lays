<ul id="carrinho" class="flex-grow overflow-y-auto mb-4 space-y-4 pr-2">
  </ul>

<script>
// 1. Inicialização (Lê do navegador ou começa vazio)
let carrinho = JSON.parse(localStorage.getItem('carrinho_lays')) || [];
let aberto = false;

// 2. FUNÇÃO: Adicionar ou Incrementar Quantidade
function addCarrinho(nome, preco) {
  // Procura se o item já está no carrinho
  const itemExistente = carrinho.find(item => item.nome === nome);

  if (itemExistente) {
    // Se já existe, só aumenta a quantidade
    itemExistente.qtd += 1;
  } else {
    // Se é novo, adiciona com quantidade 1
    carrinho.push({ nome, preco, qtd: 1 });
  }

  salvarESincronizar();
  if(!aberto) toggleCarrinho(); // Abre o carrinho para mostrar que funcionou
}

// 3. FUNÇÃO: Alterar quantidade (Botões + e -)
function alterarQtd(index, delta) {
  carrinho[index].qtd += delta;

  // Se a quantidade chegar a 0, removemos o item do carrinho
  if (carrinho[index].qtd <= 0) {
    carrinho.splice(index, 1);
  }

  salvarESincronizar();
}

// 4. FUNÇÃO: Atualizar Visual do Carrinho
function atualizarLista() {
  const lista = document.getElementById('carrinho');
  const totalElem = document.getElementById('total');
  const contadorElem = document.getElementById('contador');
  
  lista.innerHTML = '';
  let somaTotal = 0;
  let totalItens = 0;

  carrinho.forEach((item, index) => {
    const subtotal = item.preco * item.qtd;
    somaTotal += subtotal;
    totalItens += item.qtd;

    let li = document.createElement('li');
    li.className = "bg-pink-50 p-3 rounded-2xl shadow-sm border border-pink-100";
    li.innerHTML = `
      <div class="flex justify-between items-start mb-2">
        <div>
          <p class="font-bold text-gray-800">${item.nome}</p>
          <p class="text-xs text-pink-400">Unitário: R$ ${item.preco.toFixed(2)}</p>
        </div>
        <p class="font-bold text-pink-600">R$ ${subtotal.toFixed(2)}</p>
      </div>
      
      <div class="flex justify-between items-center">
        <div class="flex items-center bg-white rounded-lg border border-pink-200">
          <button onclick="alterarQtd(${index}, -1)" class="px-3 py-1 text-pink-500 font-bold hover:bg-pink-50 rounded-l-lg">-</button>
          <span class="px-3 py-1 font-semibold text-gray-700 border-x border-pink-100">${item.qtd}</span>
          <button onclick="alterarQtd(${index}, 1)" class="px-3 py-1 text-pink-500 font-bold hover:bg-pink-50 rounded-r-lg">+</button>
        </div>
        
        <button onclick="removerTotal(${index})" class="text-xs text-gray-400 hover:text-red-500 underline">Remover tudo</button>
      </div>
    `;
    lista.appendChild(li);
  });

  totalElem.innerText = somaTotal.toFixed(2);
  contadorElem.innerText = totalItens;

  if(carrinho.length === 0) {
    lista.innerHTML = '<div class="text-center mt-10 text-gray-400">🛒 Carrinho vazio...<br>Que tal um laço novo?</div>';
  }
}

// 5. FUNÇÃO: Remover o item completamente (Independente da quantidade)
function removerTotal(index) {
  carrinho.splice(index, 1);
  salvarESincronizar();
}

// 6. FUNÇÃO: Finalizar Pedido com Quantidades
function finalizarCompra() {
  if (carrinho.length === 0) return alert("Adicione itens para finalizar!");
  
  let endereco = document.getElementById('endereco').value;
  let pagamento = document.getElementById('pagamento').value;
  
  let texto = `*🛍️ Novo Pedido - Laços da Lays*%0A%0A`;
  
  carrinho.forEach(i => {
    texto += `• *${i.qtd}x* ${i.nome} (_R$${(i.preco * i.qtd).toFixed(2)}_)%0A`;
  });
  
  texto += `%0A💰 *Total:* R$ ${document.getElementById('total').innerText}`;
  texto += `%0A💳 *Pagamento:* ${pagamento}`;
  texto += `%0A🏠 *Endereço:* ${endereco || 'Retirada'}`;

  window.open(`https://wa.me/5527998346411?text=${texto}`);
}

// Auxiliares
function salvarESincronizar() {
  localStorage.setItem('carrinho_lays', JSON.stringify(carrinho));
  atualizarLista();
}

function toggleCarrinho() {
  const box = document.getElementById('carrinhoBox');
  const overlay = document.getElementById('overlay');
  aberto = !aberto;
  box.style.right = aberto ? '0' : (window.innerWidth < 768 ? '-100%' : '-400px');
  overlay.classList.toggle('hidden');
}

// Inicializa ao abrir a página
atualizarLista();
</script>
