<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Laços da Lays</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50">

<header class="bg-pink-400 text-white p-4 flex justify-between">
  <h1>Laços da Lays</h1>
  <div>🛒 <span id="contador">0</span></div>
</header>

<section class="p-4">
  <input id="busca" onkeyup="filtrar()" placeholder="Buscar...">
  
  <select id="filtro" onchange="filtrar()">
    <option value="todos">Todos</option>
    <option value="laco">Laços</option>
    <option value="tiara">Tiara</option>
    <option value="presilha">Presilha</option>
    <option value="xuxinha">Xuxinha</option>
  </select>
</section>

<section id="produtos">

<div class="produto" data-nome="laço rosa" data-tipo="laco">
  <p>Laço - R$10</p>
  <button onclick="addCarrinho('Laço',10)">Adicionar</button>
</div>

<div class="produto" data-nome="xuxinha azul" data-tipo="xuxinha">
  <p>Xuxinha - R$8</p>
  <button onclick="addCarrinho('Xuxinha',8)">Adicionar</button>
</div>

</section>

<h2>Carrinho</h2>
<ul id="carrinho"></ul>
<p>Total: <span id="total">0</span></p>

<script>
let total = 0;
let contador = 0;

function addCarrinho(nome, preco){
  let lista = document.getElementById('carrinho');
  let item = document.createElement('li');
  item.innerHTML = nome + ' - R$' + preco + ' <button onclick="this.remove()">X</button>';
  lista.appendChild(item);

  total += preco;
  contador++;

  document.getElementById('total').innerText = total;
  document.getElementById('contador').innerText = contador;
}

function filtrar(){
  let busca = document.getElementById('busca').value.toLowerCase();
  let filtro = document.getElementById('filtro').value;
  let produtos = document.querySelectorAll('.produto');

  produtos.forEach(p => {
    let nome = p.dataset.nome;
    let tipo = p.dataset.tipo;

    let okBusca = nome.includes(busca);
    let okFiltro = filtro == 'todos' || tipo == filtro;

    p.style.display = (okBusca && okFiltro) ? 'block' : 'none';
  });
}
</script>

</body>
</html>
