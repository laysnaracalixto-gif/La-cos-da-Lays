<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Laços da Lays</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50 font-sans">

<header class="bg-pink-400 text-white p-5 flex justify-between items-center shadow">
  <h1 class="text-2xl font-bold">Laços da Lays</h1>
  <div class="text-lg">🛒 <span id="contador">0</span></div>
</header>

<section class="p-4 flex gap-3">
  <input id="busca" onkeyup="filtrar()" placeholder="Buscar produto..." class="p-2 border rounded w-full">
  <select id="filtro" onchange="filtrar()" class="p-2 border rounded">
    <option value="todos">Todos</option>
    <option value="laco">Laços</option>
    <option value="tiara">Arco/Tiara</option>
    <option value="presilha">Presilha</option>
    <option value="xuxinha">Xuxinha</option>
  </select>
</section>

<section id="produtos" class="p-6 grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">

<div class="produto bg-white p-4 rounded-2xl shadow text-center" data-nome="laço rosa" data-tipo="laco">
  <h2 class="font-bold">Laço</h2>
  <p class="text-pink-500 font-semibold">R$12</p>
  <button onclick="addCarrinho('Laço',12)" class="mt-2 bg-pink-400 text-white px-4 py-2 rounded-full">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded-2xl shadow text-center" data-nome="xuxinha azul" data-tipo="xuxinha">
  <h2 class="font-bold">Xuxinha</h2>
  <p class="text-pink-500 font-semibold">R$8</p>
  <button onclick="addCarrinho('Xuxinha',8)" class="mt-2 bg-pink-400 text-white px-4 py-2 rounded-full">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded-2xl shadow text-center" data-nome="presilha rosa" data-tipo="presilha">
  <h2 class="font-bold">Presilha</h2>
  <p class="text-pink-500 font-semibold">R$10</p>
  <button onclick="addCarrinho('Presilha',10)" class="mt-2 bg-pink-400 text-white px-4 py-2 rounded-full">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded-2xl shadow text-center" data-nome="arco delicado" data-tipo="tiara">
  <h2 class="font-bold">Arco/Tiara</h2>
  <p class="text-pink-500 font-semibold">R$15</p>
  <button onclick="addCarrinho('Arco',15)" class="mt-2 bg-pink-400 text-white px-4 py-2 rounded-full">Adicionar</button>
</div>

</section>

<!-- Carrinho -->
<section class="p-6 bg-white m-6 rounded-2xl shadow">
  <h2 class="text-xl font-bold mb-3">Carrinho 🛒</h2>
  <ul id="carrinho" class="mb-3"></ul>
  <p class="font-semibold mb-3">Total: R$ <span id="total">0</span></p>

  <!-- Entrega -->
  <input id="endereco" type="text" placeholder="Digite seu endereço" class="p-2 border rounded w-full mb-2">

  <!-- Pagamento -->
  <select id="pagamento" class="p-2 border rounded w-full mb-3">
    <option value="Pix">Pix</option>
    <option value="Dinheiro">Dinheiro</option>
  </select>

  <button onclick="finalizarCompra()" class="bg-green-500 text-white px-4 py-2 rounded-full w-full">Finalizar no WhatsApp</button>
</section>

<script>
let total = 0;
let contador = 0;
let carrinho = [];

function addCarrinho(nome, preco){
  carrinho.push({nome, preco});
  atualizarLista();
}

function remover(index){
  carrinho.splice(index,1);
  atualizarLista();
}

function atualizarLista(){
  let lista = document.getElementById('carrinho');
  lista.innerHTML = '';
  total = 0;
  contador = 0;

  carrinho.forEach((item, index)=>{
    total += item.preco;
    contador++;

    let li = document.createElement('li');
    li.className = "flex justify-between mb-1";
    li.innerHTML = `${item.nome} - R$${item.preco} <button onclick="remover(${index})">❌</button>`;
    lista.appendChild(li);
  });

  document.getElementById('total').innerText = total;
  document.getElementById('contador').innerText = contador;
}

function finalizarCompra(){
  let endereco = document.getElementById('endereco').value;
  let pagamento = document.getElementById('pagamento').value;

  let msg = 'Pedido:%0A';

  carrinho.forEach(item=>{
    msg += `${item.nome} - R$${item.preco}%0A`;
  });

  msg += `Total: R$${total}%0A`;
  msg += `Pagamento: ${pagamento}%0A`;

  if(endereco){
    msg += `Endereço: ${endereco}%0A`;
  }

  window.open(`https://wa.me/5527998346411?text=${msg}`);
}

function filtrar(){
  let busca = document.getElementById('busca').value.toLowerCase();
  let filtro = document.getElementById('filtro').value;
  let produtos = document.querySelectorAll('.produto');

  produtos.forEach(p => {
    let nome = p.dataset.nome;
    let tipo = p.dataset.tipo;

    let okBusca = nome.includes(busca);
    let okFiltro = filtro == 'todos' || tipo == filtro;

    p.style.display = (okBusca && okFiltro) ? 'block' : 'none';
  });
}
</script>

<footer class="bg-pink-400 text-white text-center p-4 mt-6">
  <p>© 2026 - Laços da Lays</p>
</footer>

</body>
</html>
