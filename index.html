<div id="overlay" onclick="toggleCarrinho()" class="fixed inset-0 bg-black bg-opacity-50 hidden z-40 backdrop-blur-sm"></div>

<div id="carrinhoBox" class="fixed top-0 right-[-100%] md:right-[-400px] w-[85%] md:w-80 h-full bg-white shadow-2xl p-6 transition-all duration-500 ease-in-out z-50 flex flex-col">
  
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Seu Pedido 🛍️</h2>
    <button onclick="toggleCarrinho()" class="text-gray-400 hover:text-gray-600 text-3xl">&times;</button>
  </div>
  
  <ul id="carrinho" class="flex-grow overflow-y-auto mb-4 space-y-3 pr-2">
    </ul>

  <div class="border-t pt-4 bg-white">
    <div class="flex justify-between text-xl font-bold mb-4">
      <span>Total:</span>
      <span class="text-pink-600">R$ <span id="total">0,00</span></span>
    </div>

    <input id="endereco" type="text" placeholder="🏠 Digite seu endereço" class="p-3 border rounded-xl w-full mb-3 focus:ring-2 focus:ring-pink-300 outline-none">

    <select id="pagamento" class="p-3 border rounded-xl w-full mb-4 focus:ring-2 focus:ring-pink-300 outline-none bg-gray-50">
      <option value="Pix">Pix</option>
      <option value="Dinheiro">Dinheiro</option>
    </select>

    <button onclick="finalizarCompra()" class="bg-green-500 hover:bg-green-600 text-white font-bold py-4 rounded-2xl w-full shadow-lg transition transform active:scale-95">
      Finalizar no WhatsApp 📱
    </button>
  </div>
</div>

<script>
// Variáveis de controle
let carrinho = JSON.parse(localStorage.getItem('carrinho_lays')) || [];
let aberto = false;

// FUNÇÃO QUE VOCÊ PEDIU: Abre e fecha ao clicar no ícone lá em cima
function toggleCarrinho() {
  const box = document.getElementById('carrinhoBox');
  const overlay = document.getElementById('overlay');
  
  aberto = !aberto;

  if (aberto) {
    box.style.right = '0'; // Traz o carrinho para dentro da tela
    overlay.classList.remove('hidden'); // Mostra o fundo escuro
    document.body.style.overflow = 'hidden'; // Impede o scroll do site ao fundo
  } else {
    // Esconde o carrinho (move para a direita fora da tela)
    box.style.right = window.innerWidth < 768 ? '-100%' : '-400px';
    overlay.classList.add('hidden'); // Esconde o fundo escuro
    document.body.style.overflow = 'auto'; // Devolve o scroll ao site
  }
}

// Restante das funções de adicionar e remover (mantendo a lógica)
function addCarrinho(nome, preco) {
  carrinho.push({ nome, preco });
  salvarESincronizar();
  // Opcional: abrir o carrinho automaticamente ao adicionar
  if(!aberto) toggleCarrinho(); 
}

function salvarESincronizar() {
  localStorage.setItem('carrinho_lays', JSON.stringify(carrinho));
  atualizarLista();
}

function atualizarLista() {
  const lista = document.getElementById('carrinho');
  const totalElem = document.getElementById('total');
  const contadorElem = document.getElementById('contador');
  
  lista.innerHTML = '';
  let soma = 0;

  carrinho.forEach((item, index) => {
    soma += item.preco;
    let li = document.createElement('li');
    li.className = "flex justify-between items-center bg-pink-50 p-3 rounded-xl";
    li.innerHTML = `
      <div class="text-sm">
        <p class="font-bold text-gray-700">${item.nome}</p>
        <p class="text-pink-500">R$ ${item.preco.toFixed(2)}</p>
      </div>
      <button onclick="remover(${index})" class="text-red-500 font-bold px-2">✕</button>
    `;
    lista.appendChild(li);
  });

  totalElem.innerText = soma.toFixed(2);
  contadorElem.innerText = carrinho.length;
}

function remover(index) {
  carrinho.splice(index, 1);
  salvarESincronizar();
}
