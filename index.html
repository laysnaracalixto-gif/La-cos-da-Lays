<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Laços da Lays</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-pink-50">

<header class="bg-pink-400 text-white p-4 flex justify-between">
  <h1>Laços da Lays</h1>
  <div>🛒 <span id="contador">0</span></div>
</header>

<section class="p-4">
  <input id="busca" onkeyup="filtrar()" placeholder="Buscar..." class="p-2 border rounded w-full mb-2">
  
  <select id="filtro" onchange="filtrar()" class="p-2 border rounded w-full">
    <option value="todos">Todos</option>
    <option value="laco">Laços</option>
    <option value="tiara">Arco/Tiara</option>
    <option value="presilha">Presilha</option>
    <option value="xuxinha">Xuxinha</option>
  </select>
</section>

<section id="produtos" class="p-4 grid grid-cols-1 md:grid-cols-2 gap-4">

<div class="produto bg-white p-4 rounded shadow" data-nome="laço rosa" data-tipo="laco">
  <p>Laço - R$12</p>
  <button onclick="addCarrinho('Laço',12)" class="bg-pink-400 text-white px-3 py-1 rounded">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded shadow" data-nome="xuxinha azul" data-tipo="xuxinha">
  <p>Xuxinha - R$8</p>
  <button onclick="addCarrinho('Xuxinha',8)" class="bg-pink-400 text-white px-3 py-1 rounded">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded shadow" data-nome="presilha rosa" data-tipo="presilha">
  <p>Presilha - R$10</p>
  <button onclick="addCarrinho('Presilha',10)" class="bg-pink-400 text-white px-3 py-1 rounded">Adicionar</button>
</div>

<div class="produto bg-white p-4 rounded shadow" data-nome="arco delicado" data-tipo="tiara">
  <p>Arco/Tiara - R$15</p>
  <button onclick="addCarrinho('Arco',15)" class="bg-pink-400 text-white px-3 py-1 rounded">Adicionar</button>
</div>

</section>

<h2 class="p-4 font-bold">Carrinho</h2>
<ul id="carrinho" class="px-4"></ul>
<p class="px-4">Total: R$ <span id="total">0</span></p>

<script>
let total = 0;
let contador = 0;

function addCarrinho(nome, preco){
  let lista = document.getElementById('carrinho');
  let item = document.createElement('li');
  item.innerHTML = nome + ' - R$' + preco + ' <button onclick="this.remove(); atualizar(-'+preco+', -1)">❌</button>';
  lista.appendChild(item);

  atualizar(preco, 1);
}

function atualizar(valor, qtd){
  total += valor;
  contador += qtd;

  document.getElementById('total').innerText = total;
  document.getElementById('contador').innerText = contador;
}

function filtrar(){
  let busca = document.getElementById('busca').value.toLowerCase();
  let filtro = document.getElementById('filtro').value;
  let produtos = document.querySelectorAll('.produto');

  produtos.forEach(p => {
    let nome = p.dataset.nome;
    let tipo = p.dataset.tipo;

    let okBusca = nome.includes(busca);
    let okFiltro = filtro == 'todos' || tipo == filtro;

    p.style.display = (okBusca && okFiltro) ? 'block' : 'none';
  });
}
</script>

<footer class="bg-pink-400 text-white text-center p-4 mt-6">
  <p>© 2026 - Laços da Lays</p>
</footer>

</body>
</html>
